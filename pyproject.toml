[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-game-asset-studio"
version = "0.1.0"
description = "AutoDL game asset production workstation with anime concept art, 3D generation, rigging and Blender export"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.33,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13",
  "trimesh>=4.4,<5",
  "pygltflib>=1.16,<2",
  "numpy>=1.26,<3",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["asset_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

